<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar de Vagas</title><style>
:root{--ink:#151724;--muted:#6e7283;--line:#e5e7ee;--paper:#fff;--bg:#f6f6fa;--violet:#5c3ce6;--mint:#dff8e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}.page{max-width:1440px;margin:auto;padding:36px 28px}header{display:flex;align-items:end;justify-content:space-between;margin-bottom:28px}h1{font-size:32px;letter-spacing:-1.3px;margin:0}header p{color:var(--muted);margin:5px 0 0}.run{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}.metric{background:var(--paper);border:1px solid var(--line);padding:16px;border-radius:13px}.metric b{display:block;font-size:26px;letter-spacing:-1px}.metric span{font-size:12px;color:var(--muted)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select{border:1px solid var(--line);padding:10px 12px;border-radius:9px;background:#fff;color:var(--ink);min-height:42px}input{flex:1;min-width:230px}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#fafafe}th,td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}.title{font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:3px}.score{font-weight:800;color:var(--violet)}.tag{display:inline-block;background:#f0edff;color:#4a2cc3;padding:3px 7px;border-radius:99px;font-size:11px;margin:2px}.new{background:var(--mint);color:#17663b}.link{color:var(--violet);font-weight:600;text-decoration:none}.empty{padding:28px;color:var(--muted);text-align:center}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.page{padding:22px 14px}header{align-items:start;gap:15px;flex-direction:column}table{display:block;overflow:auto;white-space:nowrap}}
</style><body><main class="page"><header><div><h1>Radar de Vagas</h1><p>O que apareceu desde a sua última busca, organizado por prioridade.</p></div><div class="run" id="updated">Carregando…</div></header><section class="metrics" id="metrics"></section><section class="controls"><input id="query" placeholder="Buscar empresa, cargo ou tecnologia"><select id="priority"><option value="">Todas as prioridades</option><option value="75">Alta compatibilidade (75+)</option><option value="65">Boas oportunidades (65+)</option></select><select id="app"><option value="">Todos os status</option></select><select id="sort"><option value="recent">Mais recentes</option><option value="score">Maior compatibilidade</option><option value="company">Empresa</option></select></section><table><thead><tr><th>Vaga</th><th>Compatibilidade</th><th>Publicação</th><th>Modalidade</th><th>Tecnologias</th><th>Candidatura</th></tr></thead><tbody id="list"></tbody></table></main><script>
let jobs=[];const statuses=['Não analisada','Interessante','Quero me candidatar','Currículo precisa ser adaptado','Candidatura realizada','Processo seletivo','Entrevista','Teste técnico','Rejeitada','Encerrada','Oferta recebida'];const esc=s=>String(s||'Não informado').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>d?new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(d)):'Não informado';function render(){let q=query.value.toLowerCase(),min=+priority.value||0,st=app.value,view=jobs.filter(j=>JSON.stringify(j).toLowerCase().includes(q)&&j.compatibility>=min&&(!st||j.application_status===st)&&j.status==='open');view.sort((a,b)=>sort.value==='score'?b.compatibility-a.compatibility:sort.value==='company'?a.company.localeCompare(b.company):(b.published_at||'').localeCompare(a.published_at||''));list.innerHTML=view.length?view.map(j=>`<tr><td><div class="title">${esc(j.title)}</div><div class="sub">${esc(j.company)} · ${esc(j.location)}<br>${j.status==='open'&&j.first_seen_at===j.last_seen_at?'<span class="tag new">NOVA</span>':''}</div></td><td><span class="score">${j.compatibility}/100</span><div class="sub">${esc((j.strengths||[]).slice(0,2).join(' · '))}</div></td><td>${fmt(j.published_at)}</td><td>${esc(j.remote)}</td><td>${(j.technologies||[]).slice(0,5).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'—'}</td><td><a class="link" target="_blank" rel="noreferrer" href="${esc(j.apply_url)}">Candidatar</a><br><select aria-label="Status de candidatura" onchange="updateStatus('${j.id}',this.value)">${statuses.map(x=>`<option ${x===j.application_status?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td class="empty" colspan="6">Nenhuma vaga corresponde aos filtros.</td></tr>'}function metrics(){const n=jobs.filter(x=>x.status==='open'),day=Date.now()-864e5;metricsEl.innerHTML=[['Novas hoje',n.filter(x=>new Date(x.first_seen_at)>new Date(new Date().setHours(0,0,0,0))).length],['Últimas 24h',n.filter(x=>new Date(x.published_at)>day).length],['Alta compatibilidade',n.filter(x=>x.compatibility>=75).length],['Candidaturas',n.filter(x=>x.application_status==='Candidatura realizada').length],['Entrevistas',n.filter(x=>x.application_status==='Entrevista').length]].map(([l,v])=>`<article class="metric"><b>${v}</b><span>${l}</span></article>`).join('')}async function updateStatus(id,application_status){await fetch('/api/jobs/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({application_status})});jobs.find(x=>x.id===id).application_status=application_status}const metricsEl=document.getElementById('metrics'),{query,priority,app,sort,list}=Object.fromEntries(['query','priority','app','sort','list'].map(id=>[id,document.getElementById(id)]));statuses.forEach(x=>app.insertAdjacentHTML('beforeend',`<option>${x}</option>`));[query,priority,app,sort].forEach(x=>x.addEventListener('input',render));fetch('/api/jobs').then(r=>r.json()).then(x=>{jobs=x;updated.textContent='Atualizado: '+new Date().toLocaleString('pt-BR');metrics();render()}).catch(()=>updated.textContent='Execute python3 jobs.py primeiro.');
</script></main></body></html>
